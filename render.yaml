services:
  - type: web
    name: bidsure-ps100
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OCR_PROVIDER
        value: local
      - key: DOCUMENT_STORAGE
        value: supabase
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: bid-documents
      - key: PRIMARY_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
